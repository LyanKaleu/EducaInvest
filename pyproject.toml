# Dependências (gerenciadas pelo uv, árvore inteira fixada no uv.lock) e configuração das
# ferramentas do gate (gate.sh). O app não é pacote: roda com run.py, por isso não há build-system.

[project]
name = "educainvest"
version = "1.0.0"
# O grupo e o CI usam 3.14 (.python-version). O 3.13 fica na faixa para o lock valer também
# no virtualenv do deploy.
requires-python = ">=3.13,<3.15"
dependencies = [
    "flask==3.1.3",
    "flask-wtf==1.3.0",
    "pwdlib[argon2]==0.4.2",
]

[dependency-groups]
# Ferramentas do gate.sh: entram no `uv sync`, não vão para produção (`--no-dev`).
dev = [
    "ruff==0.17.4",
    "import-linter==2.16",
    "pytest==9.2.0",
]

[tool.uv]
package = false
# Mesmo formato de lock para o grupo, o CI e o Dependabot (que usa o uv 0.13).
required-version = ">=0.13"

[tool.ruff]
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
# Lista explícita: erros reais (E4/E7/E9: sintaxe e imports; F: nomes indefinidos, imports
# sem uso) + bugbear (B: armadilhas comuns). Ordenação de imports (I) fica de fora até o
# grupo decidir, porque reformataria arquivos existentes.
select = ["E4", "E7", "E9", "F", "B"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

# INVARIANTES A1: dependência só para baixo.
[[tool.importlinter.contracts]]
name = "Camadas: routes -> services -> repositories"
type = "layers"
layers = ["app.routes", "app.services", "app.repositories"]

[[tool.importlinter.contracts]]
name = "Services puros: sem Flask e sem banco"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["flask", "sqlite3", "app.db", "app.repositories"]

[[tool.importlinter.contracts]]
name = "Repositories sem Flask"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["flask"]
