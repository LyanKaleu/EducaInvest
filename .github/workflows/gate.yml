# Roda o mesmo gate.sh do Stop hook em todo PR e em todo push para develop/main.
# O ruleset da main e da develop exige este check verde para o merge.
name: gate

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # A versão do uv vem do required-version no pyproject.toml.
      # setup-uv não tem tag móvel "v10": o Dependabot (github-actions) atualiza a versão.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # --locked falha se o uv.lock estiver atrasado em relação ao pyproject.toml.
      # O Python vem do .python-version e o ambiente fica em .venv/, onde o gate.sh procura.
      - run: uv sync --locked
      - run: bash gate.sh
